native_zero: 2033
native_per_mbar: 2.9263
reader_offset: 515.975015533536
reader_scale: 0.327021812354884
pipette_detector_type: yolo1
pipette_detector_model: BoRigCombo.pt
pipette_detector_device: auto
pipette_focuser_model: regression_model2.onnx
use_ai_features: true
position_update: 1000
autofocus_dist: 50
stage_diag_move: 500
frame_lag: 4
microscope_units_per_um: 1.0
# ---------------------------------------------------------------------------
# Per-pipette geometry, one entry per pipette, keyed like the rest of the code
# (pipette_0, pipette_1, ...). Every selected pipette needs its own entry with
# all seven values below; nothing is copied from another pipette, and the
# top-level pipette_z_rotation/stage_*_axis_flip/... are NOT used once this
# section exists. Format and meaning: docs/multipipette_changes.md section 12.2.
# A stage move s becomes the pipette move  k * Rz(pipette_z_rotation) * flips * s
# (CalibratedUnit.rotate; used by Follow Stage and locate_cell):
#   stage_x/y_axis_flip: handedness of that map. The two Norwich manipulators
#                        are mirror images, so they differ here.
#   pipette_z_rotation:  rotation in the xy plane (deg)
#   pipette_k_scale:     pipette um per stage um
#   pipette_y_rotation:  descent angle of the pipette (deg)
# ---------------------------------------------------------------------------
pipettes:
  pipette_0:                      # left manipulator (COM8)
    # Values that work on BrainScanNorwichClone (Follow Stage verified there).
    stage_x_axis_flip: false
    stage_y_axis_flip: true
    pipette_z_rotation: -20.0105
    pipette_y_rotation: 25
    pipette_k_scale: 0.79156
    clean_move_order: [y, x, z]
    safe_position_delta_um: -18000
  pipette_1:                      # right manipulator (COM7)
    # Fitted 2026-11-17 from 27 manual Follow Stage trials (raw stage vs raw
    # manipulator um): proper rotation 153.4-154.6 deg, k 0.82-0.86 (axes: y 0.76,
    # x ~0.9); the x axis has ~25 um of backlash.
    stage_x_axis_flip: false
    stage_y_axis_flip: false
    pipette_z_rotation: 154.0
    pipette_y_rotation: 25
    pipette_k_scale: 0.82
    clean_move_order: [y, x, z]
    safe_position_delta_um: -18000
