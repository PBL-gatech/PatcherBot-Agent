native_zero: 2033
native_per_mbar: 2.9263
reader_offset: 515.975015533536
reader_scale: 0.327021812354884
pipette_detector_type: yolo1
pipette_detector_model: BoRigCombo.pt
pipette_detector_device: auto
pipette_focuser_model: regression_model2.onnx
use_ai_features: true
position_update: 1000
autofocus_dist: 50
stage_diag_move: 500
frame_lag: 4
stage_x_axis_flip: false
stage_y_axis_flip: false
microscope_units_per_um: 1.0
# ---------------------------------------------------------------------------
# Per-pipette geometry, one entry per pipette, keyed like the rest of the code
# (pipette_0, pipette_1, ...). Every selected pipette needs its own entry with
# all five values below; nothing is copied from another pipette, and the
# top-level pipette_z_rotation/pipette_y_rotation/... are NOT used once this
# section exists. Format and meaning: docs/multipipette_changes.md section 12.2.
#   pipette_z_rotation: direction the manipulator's +x axis points, in stage
#                       axes (deg) -- i.e. which side of the stage it sits on
#   pipette_y_rotation: descent angle of the pipette (deg)
# ---------------------------------------------------------------------------
pipettes:
  pipette_0:                      # left manipulator (COM8)
    pipette_z_rotation: -20.0105
    pipette_y_rotation: 25
    pipette_k_scale: 0.79156
    clean_move_order: [y, x, z]
    safe_position_delta_um: -18000
  pipette_1:                      # right manipulator (COM7), mirrored in x and y
    pipette_z_rotation: 159.9895  # initial guess = pipette_0 + 180; verify by jogging
    pipette_y_rotation: 25
    pipette_k_scale: 0.79156
    clean_move_order: [y, x, z]
    safe_position_delta_um: -18000
